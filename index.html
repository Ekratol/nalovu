<<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Na lovu - Školní kvíz</title>
    <link rel="stylesheet" href="styl.css">
    <style>
        .row-setup {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .row-setup label {
            width: 70px;
            font-weight: bold;
            text-align: left;
        }
        .row-setup input {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
        }
        .row-setup select {
            padding: 8px;
            border-radius: 6px;
            background: #0074d9;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Na lovu: Hlavní Lov</h1>
    
    <!-- Úvodní formulář s výběrem pozic -->
    <div id="setup-container" class="setup-screen">
        <h2>Zadejte jména a startovní pole (1-6)</h2>
        <div style="margin-bottom: 20px;">
            <div class="row-setup">
                <label>Hráč 1:</label>
                <input type="text" id="p1-name" value="Žák 1">
                <select id="p1-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
            <div class="row-setup">
                <label>Hráč 2:</label>
                <input type="text" id="p2-name" value="Žák 2">
                <select id="p2-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
            <div class="row-setup">
                <label>Hráč 3:</label>
                <input type="text" id="p3-name" value="Žák 3">
                <select id="p3-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
            <div class="row-setup">
                <label>Hráč 4:</label>
                <input type="text" id="p4-name" value="Žák 4">
                <select id="p4-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
        </div>
        <button onclick="startGame()">Spustit hru</button>
    </div>

    <!-- Hlavní herní plocha -->
    <div class="main-layout" id="main-game-layout" style="display: none;">
        <div class="quiz-container">
            <div>
                <div style="font-size: 0.9rem; color: #888; display: flex; justify-content: space-between;">
                    <span id="question-counter">Zbývá otázek: 0</span>
                    <span id="hunter-status" style="font-weight: bold; color: #ffd700;">Čekám na odpověď...</span>
                </div>
                <div class="question-box" id="question-text">Načítám otázky...</div>
                <div class="options-list">
                    <button class="option-btn" id="opt-A" onclick="revealAnswer('A')">A)</button>
                    <button class="option-btn" id="opt-B" onclick="revealAnswer('B')">B)</button>
                    <button class="option-btn" id="opt-C" onclick="revealAnswer('C')">C)</button>
                </div>
            </div>
            <div class="quiz-controls">
                <button onclick="prevQuestion()" style="background:#555;">◀ Přeskočit</button>
                <button onclick="nextQuestion()">Další otázka ▶</button>
            </div>
        </div>
        <div class="board-container" id="game-board"></div>
    </div>

    <audio id="audio-znelka" src="znelka.mp3" preload="auto"></audio>
    <audio id="audio-spravne" src="spravne.mp3" preload="auto"></audio>
    <audio id="audio-chyba" src="chyba.mp3" preload="auto"></audio>
    
 <script>
        // 1. GLOBÁLNÍ PROMĚNNÉ
        let questions = new Array();
        let currentQIndex = 0;
        let isAnswerRevealed = false;
        let playerNames = new Object();
        let gameState = new Object();

        // 2. FUNKCE PRO PŘEHRÁVÁNÍ ZVUKU
        function playSound(id) {
            const el = document.getElementById(id);
            if (el) { 
                el.currentTime = 0; 
                el.play().catch(e => console.log("Audio block active")); 
            }
        }

        // 3. NAČÍTÁNÍ OTÁZEK ZE SOUBORU
        async function loadQuestionsFromFile() {
            try {
                const res = await fetch("otazky.txt?t=" + new Date().getTime());
                const text = await res.text();
                const cleanText = text.replaceAll("\r", "");
                const lines = cleanText.split("\n");
                
                questions = lines.map(line => {
                    if (!line.trim()) return null;
                    const p = line.split(";");
                    if (p.length < 5) return null;
                    
                    return {
                        q: p.shift().trim(),
                        a: p.shift().trim(),
                        b: p.shift().trim(),
                        c: p.shift().trim(),
                        correct: p.shift().trim().toUpperCase()
                    };
                }).filter(q => q !== null);

                if (questions.length === 0) {
                    document.getElementById('question-text').innerText = "Chyba: Soubor otazky.txt je prázdný.";
                }
            } catch (error) {
                document.getElementById('question-text').innerText = "Chyba při stahování otazky.txt.";
            }
        }

        // 4. SPUŠTĚNÍ HRY Z FORMULÁŘE
        function startGame() {
            playSound('audio-znelka');
            
            for (let i = 1; i <= 4; i++) {
                const nameEl = document.getElementById("p" + i + "-name");
                const startEl = document.getElementById("p" + i + "-start");
                
                playerNames[i] = nameEl ? (nameEl.value || "Žák " + i) : "Žák " + i;
                const startPole = startEl ? (parseInt(startEl.value) || 3) : 3;
                
                gameState[i] = { 
                    player: startPole, 
                    hunter: 0, 
                    active: true 
                };
            }
            
            if (document.getElementById('setup-container')) document.getElementById('setup-container').style.display = 'none';
            if (document.getElementById('main-game-layout')) document.getElementById('main-game-layout').style.display = 'flex';
            
            createBoard();
            loadQuestion();
        }

        // 5. ZOBRAZENÍ AKTUÁLNÍ OTÁZKY
        function loadQuestion() {
            if (questions.length === 0) {
                document.getElementById('question-text').innerText = "Všechny otázky byly vyčerpány! Doplňte soubor otazky.txt.";
                document.getElementById('question-counter').innerText = "Zbývá otázek: 0";
                return;
            }
            
            if (currentQIndex >= questions.length) currentQIndex = 0;
            const q = questions[currentQIndex];
            
            if (q) {
                document.getElementById('question-text').innerText = q.q;
                document.getElementById('opt-A').innerText = "A) " + q.a;
                document.getElementById('opt-B').innerText = "B) " + q.b;
                document.getElementById('opt-C').innerText = "C) " + q.c;
                
                isAnswerRevealed = false;
                movedPlayersInCurrentRound = new Array();
                
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('correct-ans'));
                document.getElementById('question-counter').innerText = 'Otázka: ' + (currentQIndex + 1) + ' / ' + questions.length;
                document.getElementById('hunter-status').style.color = '#ffd700';
                document.getElementById('hunter-status').innerText = "Čekám na odpověď žáků...";
            }
        }


// 6. VYHODNOCENÍ ODPOVĚDI ŽÁKŮ
function revealAnswer(chosenOption) {
    if (isAnswerRevealed || questions.length === 0) return;
    isAnswerRevealed = true;
    movedPlayersInCurrentRound = new Array();
    
    const q = questions[currentQIndex];
    if (!q) return;
    
    if (document.getElementById("opt-" + q.correct)) {
        document.getElementById("opt-" + q.correct).classList.add('correct-ans');
    }
    
    const hs = document.getElementById('hunter-status');
    if (chosenOption === q.correct) {
        playSound('audio-spravne');
        if (hs) { 
            hs.style.color = '#2ecc71'; 
            hs.innerText = "Žáci: SPRÁVNĚ (Posuňte úspěšné žáky a pak stiskněte POHYB LOVCE)"; 
        }
        if (document.getElementById('btn-hunter-move')) {
            document.getElementById('btn-hunter-move').style.display = 'inline-block';
        }
    } else {
        playSound('audio-chyba');
        if (hs) { 
            hs.style.color = '#e74c3c'; 
            hs.innerText = "Žáci: CHYBNĚ (Lovec v tomto kole stojí)"; 
        }
    }
}

// 7. EXTRA MANUÁLNÍ POHYB LOVCE PEDAGOGEM
function moveHunterManual() {
    for (let p = 1; p <= 4; p++) { 
        movePawn(p, 'hunter', 1); 
    }
    const hs = document.getElementById('hunter-status');
    if (hs) { 
        hs.style.color = '#ffd700'; 
        hs.innerText = "Lovec posunut. Můžete jít na další otázku."; 
    }
    if (document.getElementById('btn-hunter-move')) {
        document.getElementById('btn-hunter-move').style.display = 'none';
    }
}

// 8. PŘEPÍNÁNÍ MEZI OTÁZKAMI
function nextQuestion() { 
    if (document.getElementById('btn-hunter-move')) {
        document.getElementById('btn-hunter-move').style.display = 'none';
    }
    if (questions.length > 0) {
        questions.splice(currentQIndex, 1);
    }
    loadQuestion(); 
}

function prevQuestion() { 
    if (document.getElementById('btn-hunter-move')) {
        document.getElementById('btn-hunter-move').style.display = 'none';
    }
    if (questions.length > 0) { 
        currentQIndex = (currentQIndex + 1) % questions.length; 
        loadQuestion(); 
    } 
}

// 8. DESKA A VYKRESLENÍ (OPRAVENO: Odstraněny zkomolené pravé závorky)
function createBoard() {
    const board = document.getElementById('game-board');
    if (!board) return;
    board.innerHTML = '';
    
    for (let p = 1; p <= 4; p++) {
        let html = '<div class="lane"><div class="lane-header" id="lane-header-' + p + '">' + playerNames[p] + '</div>';
        for (let c = 0; c <= 7; c++) {
            let cls = "cell" + (c === 0 ? " hunter-zone" : c === 7 ? " bank-zone" : "");
            html += '<div class="' + cls + '" id="l-' + p + '-c-' + c + '">' + (c === 0 ? "START L" : c === 7 ? "BANK" : "") + '</div>';
        }
        html += '<div class="manual-controls" id="controls-container-' + p + '" style="justify-content: center; background: none; padding: 5px 0;"><button id="btn-correct-' + p + '" onclick="movePawn(' + p + ', \'player\', 1)" style="background-color: #2ecc71; color: white; border: none; padding: 8px 12px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; font-size: 0.8rem;">✓ SPRÁVNĚ</button></div></div>';
        board.innerHTML += html;
    }
    
    const controlsDiv = document.querySelector('.quiz-controls');
    if (controlsDiv) {
        controlsDiv.innerHTML = '<button onclick="prevQuestion()" style="background:#555;">◀ Přeskočit</button><button onclick="moveHunterManual()" id="btn-hunter-move" style="background-color: #e74c3c; display: none; color: white; border: none; padding: 10px 15px; font-weight: bold; border-radius: 6px; cursor: pointer;">🏃 POHYB LOVCE ▶</button><button onclick="nextQuestion()">Další otázka ▶</button>';
    }
    renderPawns();
}
    
    const controlsDiv = document.querySelector('.quiz-controls');
    if (controlsDiv) {
        controlsDiv.innerHTML = '<button onclick="prevQuestion()" style="background:#555;">◀ Přeskočit</button><button onclick="moveHunterManual()" id="btn-hunter-move" style="background-color: #e74c3c; display: none; color: white; border: none; padding: 10px 15px; font-weight: bold; border-radius: 6px; cursor: pointer;">\u{1F3C3} POHYB LOVCE \u{25B6}</button><button onclick="nextQuestion()">Další otázka \u{25B6}</button>';
    }
    renderPawns();
}
// 10. VYKRESLOVÁNÍ FIGUREK + POPISKY DOLE MÍSTO TLAČÍTEK
function renderPawns() {
    document.querySelectorAll('.pawn').forEach(el => el.remove());
    for (let p = 1; p <= 4; p++) {
        let s = gameState[p];
        if (!s) continue;
        if (s.active && s.hunter < 7) {
            const hc = document.getElementById("l-" + p + "-c-" + s.hunter);
            if (hc) hc.innerHTML += '<div class="pawn hunter">L</div>';
        }
        if (s.active && s.player < 7) {
            const pc = document.getElementById("l-" + p + "-c-" + s.player);
            if (pc) pc.innerHTML += '<div class="pawn player">' + p + '</div>';
        }
        let h = document.getElementById("lane-header-" + p);
        let container = document.getElementById("controls-container-" + p);
        if (h && container) {
            if (!s.active) {
                h.style.color = '#e74c3c'; h.innerText = playerNames[p];
                container.innerHTML = '<span style="color: #e74c3c; font-weight: bold; font-size: 0.9rem;">❌ CHYCEN</span>';
            } else if (s.player === 7) {
                h.style.color = '#2ecc71'; h.innerText = playerNames[p];
                container.innerHTML = '<span style="color: #2ecc71; font-weight: bold; font-size: 0.9rem;">💰 UTEKL</span>';
            } else {
                h.style.color = 'var(--gold)'; h.innerText = playerNames[p];
            }
        }
    }
    checkGameEnd();
}

// 11. MANUÁLNÍ A AUTOMATICKÝ POHYB FIGUREK S JEDNOTLIVÝM ZÁMKEM
function movePawn(playerNum, role, steps) {
    let s = gameState[playerNum];
    if (!s || !s.active) return;
    if (role === 'player' && !isAnswerRevealed) return;
    if (role === 'player' && movedPlayersInCurrentRound.includes(playerNum)) return;
    if (role === 'player') { 
        s.player += steps; 
        movedPlayersInCurrentRound.push(playerNum);
        if (s.player > 7) s.player = 7; 
        if (s.player === 7) playSound('audio-spravne');
    } else if (role === 'hunter') { 
        s.hunter += steps; 
        if (s.hunter > 7) s.hunter = 7; 
    }
    if (s.hunter >= s.player && s.player < 7) { s.active = false; playSound('audio-chyba'); }
    renderPawns();
}

// 12. AUTOMATICKÝ KONEC HRY
function checkGameEnd() {
    let active = false;
    for (let p = 1; p <= 4; p++) { if (gameState[p] && gameState[p].active && gameState[p].player < 7) active = true; }
    if (!active && Object.keys(playerNames).length > 0) {
        let sv = new Array(), cg = new Array();
        for (let p = 1; p <= 4; p++) { (gameState[p].player === 7 ? sv : cg).push(playerNames[p]); }
        if (document.getElementById('question-counter')) document.getElementById('question-counter').parentElement.style.display = 'none';
        if (document.getElementById('opt-A')) document.getElementById('opt-A').parentElement.style.display = 'none';
        if (document.querySelector('.quiz-controls')) document.querySelector('.quiz-controls').style.display = 'none';
        const qText = document.getElementById('question-text');
        if (qText) { qText.innerHTML = '<div style="text-align: center; padding: 10px;"><h2 style="color: var(--gold); margin: 0 0 10px 0;">Konec!</h2><p>Utekli: ' + (sv.join(', ') || 'Nikdo') + '</p><p>Chyceni: ' + (cg.join(', ') || 'Nikdo') + '</p><button onclick="resetGame()" style="padding: 10px 20px; font-weight: bold; background-color: #ffd700; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;">Hrát znovu</button></div>'; }
        playSound('audio-znelka');
    }
}

// 13. RESTART FORMULÁŘE PRO DALŠÍ KOLO (OTÁZKY ZŮSTÁVAJÍ)
function resetGame() {
    document.getElementById('main-game-layout').style.display = 'none';
    document.getElementById('setup-container').style.display = 'block';
    if (document.getElementById('question-counter')) document.getElementById('question-counter').parentElement.style.display = 'flex';
    if (document.getElementById('opt-A')) document.getElementById('opt-A').parentElement.style.display = 'flex';
    if (document.querySelector('.quiz-controls')) document.querySelector('.quiz-controls').style.display = 'flex';
    if (document.getElementById('question-text')) document.getElementById('question-text').innerHTML = "Načítám otázky...";
    gameState = {}; playerNames = {}; movedPlayersInCurrentRound = new Array();
}

window.onload = function() { loadQuestionsFromFile(); };
</script>
</body>
</html>
