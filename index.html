<<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Na lovu - Školní kvíz</title>
    <link rel="stylesheet" href="styl.css">
    <style>
        .row-setup {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .row-setup label {
            width: 70px;
            font-weight: bold;
            text-align: left;
        }
        .row-setup input {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
        }
        .row-setup select {
            padding: 8px;
            border-radius: 6px;
            background: #0074d9;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Na lovu: Hlavní Lov</h1>
    
    <!-- Úvodní formulář s výběrem pozic -->
    <div id="setup-container" class="setup-screen">
        <h2>Zadejte jména a startovní pole (1-6)</h2>
        <div style="margin-bottom: 20px;">
            <div class="row-setup">
                <label>Hráč 1:</label>
                <input type="text" id="p1-name" value="Žák 1">
                <select id="p1-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
            <div class="row-setup">
                <label>Hráč 2:</label>
                <input type="text" id="p2-name" value="Žák 2">
                <select id="p2-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
            <div class="row-setup">
                <label>Hráč 3:</label>
                <input type="text" id="p3-name" value="Žák 3">
                <select id="p3-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
            <div class="row-setup">
                <label>Hráč 4:</label>
                <input type="text" id="p4-name" value="Žák 4">
                <select id="p4-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
        </div>
        <button onclick="startGame()">Spustit hru</button>
    </div>

    <!-- Hlavní herní plocha -->
    <div class="main-layout" id="main-game-layout" style="display: none;">
        <div class="quiz-container">
            <div>
                <div style="font-size: 0.9rem; color: #888; display: flex; justify-content: space-between;">
                    <span id="question-counter">Zbývá otázek: 0</span>
                    <span id="hunter-status" style="font-weight: bold; color: #ffd700;">Čekám na odpověď...</span>
                </div>
                <div class="question-box" id="question-text">Načítám otázky...</div>
                <div class="options-list">
                    <button class="option-btn" id="opt-A" onclick="revealAnswer('A')">A)</button>
                    <button class="option-btn" id="opt-B" onclick="revealAnswer('B')">B)</button>
                    <button class="option-btn" id="opt-C" onclick="revealAnswer('C')">C)</button>
                </div>
            </div>
            <div class="quiz-controls">
                <button onclick="prevQuestion()" style="background:#555;">◀ Přeskočit</button>
                <button onclick="nextQuestion()">Další otázka ▶</button>
            </div>
        </div>
        <div class="board-container" id="game-board"></div>
    </div>

    <audio id="audio-znelka" src="znelka.mp3" preload="auto"></audio>
    <audio id="audio-spravne" src="spravne.mp3" preload="auto"></audio>
    <audio id="audio-chyba" src="chyba.mp3" preload="auto"></audio>
    
 <script>
// 1. INICIALIZACE PROMĚNNÝCH
let questions = [];
let currentQIndex = 0;
let isAnswerRevealed = false;
let playerNames = {};
let gameState = {};

// Pomocná funkce pro bezpečné přehrávání zvuku
function playSound(id) {
    const el = document.getElementById(id);
    if (el) { 
        el.currentTime = 0; 
        el.play().catch(e => console.log("Audio block:", e)); 
    }
}

// 2. NAČÍTÁNÍ OTÁZEK ZE SOUBORU
async function loadQuestionsFromFile() {
    try {
        const res = await fetch("otazky.txt?t=" + new Date().getTime());
        const text = await res.text();
        const cleanText = text.replaceAll("\r", "");
        const lines = cleanText.split("\n");
        
        questions = lines.map(line => {
            if (!line.trim()) return null;
            const p = line.split(";");
            if (p.length < 5) return null;
            
            return {
                q: p.shift().trim(),
                a: p.shift().trim(),
                b: p.shift().trim(),
                c: p.shift().trim(),
                correct: p.shift().trim().toUpperCase()
            };
        }).filter(q => q !== null);

        if (questions.length === 0) {
            const qText = document.getElementById('question-text');
            if (qText) qText.innerText = "Chyba: Soubor otazky.txt je prázdný.";
        }
    } catch (error) {
        const qText = document.getElementById('question-text');
        if (qText) qText.innerText = "Chyba při stahování otazky.txt.";
    }
}

// 3. SPUŠTĚNÍ HRY (ZADÁNÍ HRÁČŮ)
function startGame() {
    playSound('audio-znelka');
    
    for (let i = 1; i <= 4; i++) {
        const nameEl = document.getElementById("p" + i + "-name");
        const startEl = document.getElementById("p" + i + "-start");
        
        playerNames[i] = nameEl ? (nameEl.value || "Žák " + i) : "Žák " + i;
        const startPole = startEl ? (parseInt(startEl.value) || 3) : 3;
        
        gameState[i] = { player: startPole, hunter: 0, active: true };
    }
    
    const setupCont = document.getElementById('setup-container');
    const mainLayout = document.getElementById('main-game-layout');
    
    if (setupCont) setupCont.style.display = 'none';
    if (mainLayout) mainLayout.style.display = 'flex';
    
    createBoard();
      if (typeof createBoard === "function") createBoard();
    
    // OPRAVA: Pokud už jsme v předchozí hře nějaké otázky odehráli, 
    // posuneme index před načtením na další otázku, aby tam nezůstávala ta stará.
    if (currentQIndex > 0) {
        currentQIndex++;
    }
    
    if (typeof loadQuestion === "function") loadQuestion();
}
    loadQuestion();
}
// 4. ZOBRAZENÍ AKTUÁLNÍ OTÁZKY
function loadQuestion() {
    if (questions.length === 0) {
        document.getElementById('question-text').innerText = "Všechny otázky byly vyčerpány!";
        return;
    }

    // Ochrana přetečení indexu – otáčí otázky stále dokola
    if (currentQIndex >= questions.length) {
        currentQIndex = 0; 
    }

    const currentQuestion = questions[currentQIndex];
    
    if (currentQuestion) {
        const qText = document.getElementById('question-text');
        const optA = document.getElementById('opt-A');
        const optB = document.getElementById('opt-B');
        const optC = document.getElementById('opt-C');
        
        if (qText) qText.innerText = currentQuestion.q;
        if (optA) optA.innerText = "A) " + currentQuestion.a;
        if (optB) optB.innerText = "B) " + currentQuestion.b;
        if (optC) optC.innerText = "C) " + currentQuestion.c;
        
        isAnswerRevealed = false;
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('correct-ans'));
        
        const qCounter = document.getElementById('question-counter');
        if (qCounter) qCounter.innerText = 'Otázka číslo: ' + (currentQIndex + 1) + ' / ' + questions.length;
    }
}

// 5. GENEROVÁNÍ HERNÍ DESKY (DRÁHY PRO 4 ŽÁKY)
function createBoard() {
    const board = document.getElementById('game-board');
    if (!board) return;
    board.innerHTML = '';
    
    for (let p = 1; p <= 4; p++) {
        let html = '<div class="lane"><div class="lane-header" id="lane-header-' + p + '">' + playerNames[p] + '</div>';
        for (let c = 0; c <= 7; c++) {
            let cls = "cell" + (c === 0 ? " hunter-zone" : c === 7 ? " bank-zone" : "");
            html += '<div class="' + cls + '" id="l-' + p + '-c-' + c + '">' + (c === 0 ? "START L" : c === 7 ? "BANK" : "") + '</div>';
        }
        html += '<div class="manual-controls" style="justify-content: center; background: none; padding: 5px 0;"><button id="btn-correct-' + p + '" onclick="movePawn(' + p + ', \'player\', 1)" style="background-color: #2ecc71; color: white; border: none; padding: 8px 12px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; font-size: 0.8rem;">✓ SPRÁVNĚ</button></div></div>';
        board.innerHTML += html;
    }
    renderPawns();
}

// 6. VYKRESLENÍ FIGUREK ŽÁKŮ A LOVCE (L) NA POLÍČKA
function renderPawns() {
    document.querySelectorAll('.pawn').forEach(el => el.remove());
    for (let p = 1; p <= 4; p++) {
        let s = gameState[p];
        if (!s) continue;
        
        if (s.active && s.hunter < 7) {
            const hunterCell = document.getElementById("l-" + p + "-c-" + s.hunter);
            if (hunterCell) hunterCell.innerHTML += '<div class="pawn hunter">L</div>';
        }
        if (s.active && s.player < 7) {
            const playerCell = document.getElementById("l-" + p + "-c-" + s.player);
            if (playerCell) playerCell.innerHTML += '<div class="pawn player">' + p + '</div>';
        }
        
        let h = document.getElementById("lane-header-" + p);
        let b = document.getElementById("btn-correct-" + p);
        if (h) {
            if (!s.active) {
                h.style.color = '#e74c3c'; h.innerText = 'Chycen';
                if (b) b.style.display = 'none';
            } else if (s.player === 7) {
                h.style.color = '#2ecc71'; h.innerText = 'Utekl';
                if (b) b.style.display = 'none';
            } else {
                h.style.color = 'var(--gold)'; h.innerText = playerNames[p];
            }
        }
    }
}
// FUNKCE PRO POHYB FIGUREK (ŽÁKŮ I LOVCE)
function movePawn(playerIndex, role, steps) {
    let s = gameState[playerIndex];
    if (!s || !s.active) return;

    if (role === 'player') {
        s.player += steps;
        if (s.player > 7) s.player = 7; // Pojistka proti přetečení desky
    } else if (role === 'hunter') {
        s.hunter += steps;
        if (s.hunter > 7) s.hunter = 7;
    }

    // KONTROLA CHYCENÍ: Pokud lovec dohoní nebo předežene hráče
    if (s.hunter >= s.player && s.player < 7) {
        s.active = false;
        playSound('audio-chycen'); // Pokud máte zvuk pro chycení
    }

    // Překreslíme desku s novými pozicemi
    renderPawns();
    
    // Zkontrolujeme, zda hra neskončila (zda už všichni neutekli/nebyli chyceni)
    if (typeof checkGameEnd === "function") {
        checkGameEnd();
    }
}

// 8. VYHODNOCENÍ ODPOVĚDI (Bez automatického pohybu lovce!)
function revealAnswer(chosenOption) {
    if (isAnswerRevealed || questions.length === 0) return;
    isAnswerRevealed = true;
    
    let q = questions[currentQIndex];
    const correctBtn = document.getElementById("opt-" + q.correct);
    if (correctBtn) correctBtn.classList.add('correct-ans');
    
    const hs = document.getElementById('hunter-status');

    if (chosenOption === q.correct) {
        playSound('audio-spravne');
        if (hs) {
            hs.style.color = '#2ecc71';
            hs.innerText = "Žáci: SPRÁVNĚ (Nyní posuňte žáky a pak stiskněte 'Posunout lovce')";
        }
        // POZNÁMKA: setTimeout s movePawn pro lovce odsud byl smazán! Lovec čeká.
    } else {
        playSound('audio-chyba');
        if (hs) {
            hs.style.color = '#e74c3c';
            hs.innerText = "Žáci: CHYBNĚ (Lovec v tomto kole zůstává stát)";
        }
    }
}

// NOVÁ FUNKCE: Pro extra tlačítko na manuální posun lovce
function moveHunterManual() {
    // Funkce posune lovce na všech drahách o 1 pole dolů
    if (typeof movePawn === "function") {
        for (let p = 1; p <= 4; p++) {
            movePawn(p, 'hunter', 1);
        }
    }
    
    const hs = document.getElementById('hunter-status');
    if (hs) {
        hs.style.color = '#ffd700';
        hs.innerText = "Lovec byl posunut. Můžete přejít na další otázku.";
    }
}

// 8. OVLÁDÁNÍ TLAČÍTEK OTÁZEK
function nextQuestion() { 
    currentQIndex++;
    loadQuestion(); 
}

// Funkce zachovává index v mezích pole otázek
function prevQuestion() {
    if (questions.length > 0) {
        currentQIndex = (currentQIndex - 1 + questions.length) % questions.length;
        loadQuestion();
    }
}

// 9. KONTROLA KONCE HRY A TABULKA VÝSLEDKŮ
function checkGameEnd() {
    let active = false;
    for (let p = 1; p <= 4; p++) {
        if (gameState[p] && gameState[p].active && gameState[p].player < 7) active = true;
    }
    
    if (!active && Object.keys(playerNames).length > 0) {
        let sv = [];
        let cg = [];
        for (let p = 1; p <= 4; p++) {
            if (gameState[p].player === 7) sv.push(playerNames[p]);
            else cg.push(playerNames[p]);
        }
        
        const qCounter = document.getElementById('question-counter');
        const optA = document.getElementById('opt-A');
        const qControls = document.querySelector('.quiz-controls');
        
        if (qCounter) qCounter.parentElement.style.display = 'none';
        if (optA) optA.parentElement.style.display = 'none';
        if (qControls) qControls.style.display = 'none';
        
        const qText = document.getElementById('question-text');
        if (qText) {
            qText.innerHTML = `
                <div style="text-align: center; padding: 10px;">
                    <h2 style="color: var(--gold); margin: 0 0 10px 0;">Konec hry!</h2>
                    <p>Utekli: ${sv.join(', ') || 'Nikdo'}</p>
                    <p>Chyceni: ${cg.join(', ') || 'Nikdo'}</p>
                    <button onclick="resetGame()" style="padding: 10px 20px; font-weight: bold; background-color: #ffd700; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;">Hrát znovu</button>
                </div>
            `;
        }
    }
}

// 10. RESTART ZÁPASU (ZACHOVÁVÁ INDEX OTÁZKY currentQIndex)
function resetGame() {
    document.getElementById('main-game-layout').style.display = 'none';
    document.getElementById('setup-container').style.display = 'block';
    
    const qCounter = document.getElementById('question-counter');
    const optA = document.getElementById('opt-A');
    const qControls = document.querySelector('.quiz-controls');
    
    if (qCounter) qCounter.parentElement.style.display = 'flex';
    if (optA) optA.parentElement.style.display = 'flex';
    if (qControls) qControls.style.display = 'flex';
    
    const qText = document.getElementById('question-text');
    if (qText) qText.innerHTML = "Načítám otázky...";
    
    gameState = {};
    playerNames = {};
}

// Automatické stažení otazky.txt po načtení stránky v prohlížeči
window.onload = function() { 
    loadQuestionsFromFile(); 
};
</script>
</body>
</html>
