<<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Na lovu - Školní kvíz</title>
    <link rel="stylesheet" href="styl.css">
    <style>
        .row-setup {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .row-setup label {
            width: 70px;
            font-weight: bold;
            text-align: left;
        }
        .row-setup input {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
        }
        .row-setup select {
            padding: 8px;
            border-radius: 6px;
            background: #0074d9;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Na lovu: Hlavní Lov</h1>
    
    <!-- Úvodní formulář s výběrem pozic -->
    <div id="setup-container" class="setup-screen">
        <h2>Zadejte jména a startovní pole (1-6)</h2>
        <div style="margin-bottom: 20px;">
            <div class="row-setup">
                <label>Hráč 1:</label>
                <input type="text" id="p1-name" value="Žák 1">
                <select id="p1-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
            <div class="row-setup">
                <label>Hráč 2:</label>
                <input type="text" id="p2-name" value="Žák 2">
                <select id="p2-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
            <div class="row-setup">
                <label>Hráč 3:</label>
                <input type="text" id="p3-name" value="Žák 3">
                <select id="p3-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
            <div class="row-setup">
                <label>Hráč 4:</label>
                <input type="text" id="p4-name" value="Žák 4">
                <select id="p4-start"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
            </div>
        </div>
        <button onclick="startGame()">Spustit hru</button>
    </div>

    <!-- Hlavní herní plocha -->
    <div class="main-layout" id="main-game-layout" style="display: none;">
        <div class="quiz-container">
            <div>
                <div style="font-size: 0.9rem; color: #888; display: flex; justify-content: space-between;">
                    <span id="question-counter">Zbývá otázek: 0</span>
                    <span id="hunter-status" style="font-weight: bold; color: #ffd700;">Čekám na odpověď...</span>
                </div>
                <div class="question-box" id="question-text">Načítám otázky...</div>
                <div class="options-list">
                    <button class="option-btn" id="opt-A" onclick="revealAnswer('A')">A)</button>
                    <button class="option-btn" id="opt-B" onclick="revealAnswer('B')">B)</button>
                    <button class="option-btn" id="opt-C" onclick="revealAnswer('C')">C)</button>
                </div>
            </div>
            <div class="quiz-controls">
                <button onclick="prevQuestion()" style="background:#555;">◀ Přeskočit</button>
                <button onclick="nextQuestion()">Další otázka ▶</button>
            </div>
        </div>
        <div class="board-container" id="game-board"></div>
    </div>

    <audio id="audio-znelka" src="znelka.mp3" preload="auto"></audio>
    <audio id="audio-spravne" src="spravne.mp3" preload="auto"></audio>
    <audio id="audio-chyba" src="chyba.mp3" preload="auto"></audio>

    <script>
        let questions = new Array();
        let currentQIndex = 0;
        let isAnswerRevealed = false;
        let playerNames = new Object();
        
        // Založení prázdného stavu, který se vyplní až po kliknutí na Spustit hru
        let gameState = new Object();

        function playSound(id) {
            const el = document.getElementById(id);
            if (el) { el.currentTime = 0; el.play().catch(e => console.log("Audio block")); }
        }
       async function loadQuestionsFromFile() {
            try {
                const res = await fetch("otazky.txt?t=" + new Date().getTime());
                const text = await res.text();
                const cleanText = text.replaceAll("\r", "");
                const lines = cleanText.split("\n");
                
                questions = lines.map(line => {
                    if (!line.trim()) return null;
                    const p = line.split(";");
                    if (p.length < 5) return null;
                    
                    const dataotazky = p.shift().trim();
                    const odpovedA = p.shift().trim();
                    const odpovedB = p.shift().trim();
                    const odpovedC = p.shift().trim();
                    const spravnePismeno = p.shift().trim().toUpperCase();
                    
                    return {
                        q: dataotazky,
                        a: odpovedA,
                        b: odpovedB,
                        c: odpovedC,
                        correct: spravnePismeno
                    };
                }).filter(q => q !== null);

                if (questions.length === 0) {
                    document.getElementById('question-text').innerText = "Chyba: Soubor otazky.txt je prázdný.";
                }
            } catch (error) {
                document.getElementById('question-text').innerText = "Chyba při stahování otazky.txt.";
            }
        }

        function startGame() {
            playSound('audio-znelka');
            
            // Načtení jmen a dynamické nastavení startovních polí podle učitele
            for (let i = 1; i <= 4; i++) {
                playerNames[i] = document.getElementById("p" + i + "-name").value || "Žák " + i;
                const startPole = parseInt(document.getElementById("p" + i + "-start").value) || 3;
                
                gameState[i] = {
                    player: startPole,
                    hunter: 0,
                    active: true
                };
            }
            
            document.getElementById('setup-container').style.display = 'none';
            document.getElementById('main-game-layout').style.display = 'flex';
            createBoard();
            loadQuestion();
        }
  function createBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            for (let p = 1; p <= 4; p++) {
                let html = '<div class="lane"><div class="lane-header" id="lane-header-' + p + '">' + playerNames[p] + '</div>';
                for (let c = 0; c <= 7; c++) {
                    let cls = "cell" + (c === 0 ? " hunter-zone" : c === 7 ? " bank-zone" : "");
                    html += '<div class="' + cls + '" id="l-' + p + '-c-' + c + '">' + (c === 0 ? "START L" : c === 7 ? "BANK" : "") + '</div>';
                }
                html += '<div class="manual-controls" style="justify-content: center; background: none; padding: 5px 0;"><button id="btn-correct-' + p + '" onclick="movePawn(' + p + ', \'player\', 1)" style="background-color: #2ecc71; color: white; border: none; padding: 8px 12px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; font-size: 0.8rem;">✓ SPRÁVNĚ</button></div></div>';
                board.innerHTML += html;
            }
            renderPawns();
        }

        function renderPawns() {
            document.querySelectorAll('.pawn').forEach(el => el.remove());
            for (let p = 1; p <= 4; p++) {
                let s = gameState[p];
                if (s.active && s.hunter < 7) {
                    document.getElementById("l-" + p + "-c-" + s.hunter).innerHTML += '<div class="pawn hunter">L</div>';
                }
                if (s.active && s.player < 7) {
                    document.getElementById("l-" + p + "-c-" + s.player).innerHTML += '<div class="pawn player">' + p + '</div>';
                }
                let h = document.getElementById("lane-header-" + p);
                let b = document.getElementById("btn-correct-" + p);
                if (h) {
                    if (!s.active) {
                        h.style.color = '#e74c3c'; h.innerText = 'Chycen';
                        if (b) b.style.display = 'none';
                    } else if (s.player === 7) {
                        h.style.color = '#2ecc71'; h.innerText = 'Utekl';
                        if (b) b.style.display = 'none';
                    } else {
                        h.style.color = 'var(--gold)'; h.innerText = playerNames[p];
                    }
                }
            }
       function checkGameEnd() {
            let active = false;
            for (let p = 1; p <= 4; p++) {
                if (gameState[p] && gameState[p].active && gameState[p].player < 7) active = true;
            }
            if (!active && Object.keys(playerNames).length > 0) {
                let sv = new Array();
                let cg = new Array();
                for (let p = 1; p <= 4; p++) {
                    if (gameState[p].player === 7) sv.push(playerNames[p]);
                    else cg.push(playerNames[p]);
                }
                
                // Schováme herní prvky kvízu a ukážeme pouze tabulku výsledků na konci hry
                document.getElementById('question-counter').parentElement.style.display = 'none';
                document.getElementById('opt-A').parentElement.style.display = 'none';
                document.querySelector('.quiz-controls').style.display = 'none';
                
                document.getElementById('question-text').innerHTML = `
                    <div style="text-align: center; padding: 10px;">
                        <h2 style="color: var(--gold); margin: 0 0 15px 0;">Konec Hry!</h2>
                        <p style="font-size: 1.1rem; margin: 10px 0;">💰 <strong>Zachránění:</strong><br> ${sv.length ? sv.join(', ') : 'Nikdo'}</p>
                        <p style="font-size: 1.1rem; margin: 10px 0; color: #e74c3c;">🏹 <strong>Chyceni Lovcem:</strong><br> ${cg.length ? cg.join(', ') : 'Nikdo'}</p>
                        <button onclick="resetGame()" style="margin-top: 20px; background-color: var(--accent); color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer;">Hrát znovu</button>
                    </div>
                `;
                playSound('audio-znelka');
            }
        }

        // OPRAVENO: Funkce pouze skryje a ukáže správné panely, aniž by ničila HTML kód tlačítek
        function resetGame() {
            document.getElementById('main-game-layout').style.display = 'none';
            document.getElementById('setup-container').style.display = 'block';
            
            // Obnovíme viditelnost všech kvízových prvků pro další kolo
            document.getElementById('question-counter').parentElement.style.display = 'flex';
            document.getElementById('opt-A').parentElement.style.display = 'flex';
            document.querySelector('.quiz-controls').style.display = 'flex';
            document.getElementById('question-text').innerHTML = "Načítám otázky...";
            
            gameState = new Object();
            playerNames = new Object();
        }

        function loadQuestion() {
            if (questions.length === 0) {
                document.getElementById('question-text').innerText = "Všechny otázky byly vyčerpány! Doplňte soubor otazky.txt.";
                document.getElementById('question-counter').innerText = "Zbývá otázek: 0";
                return;
            }
            isAnswerRevealed = false;
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('correct-ans'));
            let q = questions[currentQIndex];
            document.getElementById('question-counter').innerText = 'Zbývá otázek: ' + questions.length;
            document.getElementById('hunter-status').style.color = '#ffd700';
            document.getElementById('hunter-status').innerText = "Čekám na odpověď žáků...";
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('opt-A').innerText = "A) " + q.a;
            document.getElementById('opt-B').innerText = "B) " + q.b;
            document.getElementById('opt-C').innerText = "C) " + q.c;
        }
      function revealAnswer(chosenOption) {
            if (isAnswerRevealed || questions.length === 0) return;
            isAnswerRevealed = true;
            let q = questions[currentQIndex];
            document.getElementById("opt-" + q.correct).classList.add('correct-ans');
            const hs = document.getElementById('hunter-status');

            if (chosenOption === q.correct) {
                playSound('audio-spravne');
                hs.style.color = '#2ecc71';
                hs.innerText = "Žáci: SPRÁVNĚ (Lovec jde dopředu)";
                
                // OPRAVENO: Lovec se posune dopředu POUZE při správné odpovědi
                setTimeout(() => {
                    for (let p = 1; p <= 4; p++) movePawn(p, 'hunter', 1);
                }, 1200);
            } else {
                playSound('audio-chyba');
                hs.style.color = '#e74c3c';
                hs.innerText = "Žáci: CHYBNĚ (Lovec zůstává stát)";
                // Zde chybí kód pro pohyb Lovce, takže Lovec při chybě stojí!
            }

            questions.splice(currentQIndex, 1);
            if (currentQIndex >= questions.length && questions.length > 0) {
                currentQIndex = questions.length - 1;
            }
        }
        
        function nextQuestion() { loadQuestion(); }
        
        function prevQuestion() {
            if (questions.length > 0) {
                currentQIndex = (currentQIndex + 1) % questions.length;
                loadQuestion();
            }
        }

        window.onload = function() { loadQuestionsFromFile(); };
    </script>
</body>
</html>
